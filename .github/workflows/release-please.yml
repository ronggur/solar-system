name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: 🏷️ Release PR
    runs-on: ubuntu-latest

    steps:
      # Releases created with the default GITHUB_TOKEN do not trigger other workflows,
      # so deploy.yml (on: release published) only runs when RELEASE_PLEASE_TOKEN is set.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          release-type: simple
