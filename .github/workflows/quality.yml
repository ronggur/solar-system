name: Quality Check

on:
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - run: npm run lint

  audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      # Production dependencies only: dev-tooling advisories are tracked separately (see docs).
      - run: npm audit --omit=dev --audit-level=moderate
        env:
          CI: true

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, audit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - run: npm run build
        env:
          NODE_ENV: production
